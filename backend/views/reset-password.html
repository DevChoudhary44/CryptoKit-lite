<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password - CryptoKit</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f1220;color:#e8eaf6;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
  form{background:#181c30;padding:2rem;border-radius:12px;width:min(92vw,380px);display:grid;gap:.9rem}
  input,button{padding:.7rem;border-radius:8px;border:1px solid #333a5c;font-size:1rem}
  input{background:#0f1220;color:inherit}
  button{background:#5b6cff;color:#fff;border:0;cursor:pointer}
  #msg{min-height:1.2em;font-size:.9rem}
  a{color:#9fa8ff}
</style>
</head>
<body>
<form id="f">
  <h2 style="margin:0">Set a new password</h2>
  <input id="p1" type="password" placeholder="New password (min 8 chars)" autocomplete="new-password" required>
  <input id="p2" type="password" placeholder="Repeat new password" autocomplete="new-password" required>
  <button type="submit">Update password</button>
  <div id="msg"></div>
  <a href="/">Back to CryptoKit</a>
</form>
<script>
  var token = new URLSearchParams(location.search).get('token') || '';
  var msg = document.getElementById('msg');
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1 !== p2) { msg.textContent = 'Passwords do not match'; return; }
    fetch('/api/auth/reset-password', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: p1 })
    }).then(function (r) { return r.json(); }).then(function (d) {
      msg.textContent = d.message || d.error || 'Done';
    }).catch(function () { msg.textContent = 'Network error'; });
  });
</script>
</body>
</html>
